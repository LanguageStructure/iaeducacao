name: Restore and update Encontro 3
on:
  push:
    paths:
      - '.github/workflows/restore-update-encontro3.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/update_encontro3.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add encontro-3/index.html
          git commit -m "Add Hinton discussion to Encontro 3"
          git push
